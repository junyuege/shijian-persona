<title>史鉴 · 人物原型测试</title>
<style>
/* ============================================================
   史鉴 · 人物原型测试  —  样式层
   色板：纸 #F0EBE5 / 墨 #1A1A2E / 暗金 #8B7355 / 深红 #8B2E2E
   ============================================================ */
:root{
  --paper-hi:#F8F5F0;
  --paper:#F0EBE5;
  --paper-lo:#E7DFD4;
  --card:#FBF9F6;
  --card-hi:#FFFDFA;
  --ink:#1A1A2E;
  --ink-soft:#2E2E42;
  --gold:#8B7355;
  --gold-line:rgba(139,115,85,.22);
  --gold-line-strong:rgba(139,115,85,.45);
  --crimson:#8B2E2E;
  --crimson-hi:#9B3535;
  --crimson-wash:rgba(139,46,46,.08);
  --grey:#A2968A;
  --serif:"Noto Serif SC","Source Han Serif SC","Songti SC","STSong","SimSun",serif;
  --kai:"KaiTi","STKaiti","Kaiti SC","Noto Serif SC","Songti SC",serif;
}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}

html{-webkit-text-size-adjust:100%}

body{
  font-family:var(--serif);
  color:var(--ink);
  line-height:1.75;
  min-height:100vh;
  background:linear-gradient(168deg,var(--paper-hi) 0%,var(--paper) 44%,var(--paper-lo) 100%);
  background-attachment:fixed;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}

/* 极淡的两点晕染，避免纯色平板感 */
body::before{
  content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(circle at 18% 12%,rgba(139,115,85,.055) 0,transparent 52%),
    radial-gradient(circle at 84% 80%,rgba(139,46,46,.035) 0,transparent 48%);
}

.app{
  position:relative;z-index:1;
  max-width:500px;margin:0 auto;
  padding:30px 20px calc(48px + env(safe-area-inset-bottom));
}

/* ---------- 屏幕切换 ---------- */
.screen{display:none}
.screen.active{display:block;animation:screenIn .52s cubic-bezier(.22,.61,.36,1)}
@keyframes screenIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

/* ---------- 首页 ---------- */
.eyebrow{
  text-align:center;
  margin-bottom:46px;
  padding-bottom:16px;
  border-bottom:1px solid var(--gold-line);
}
.eyebrow-en{
  display:block;
  font-family:var(--kai);
  font-size:12.5px;
  letter-spacing:.34em;
  color:var(--gold);
  opacity:.9;
}
.eyebrow-cn{
  display:block;
  margin-top:9px;
  font-size:12px;
  letter-spacing:.26em;
  color:var(--gold);
  opacity:.72;
}

.home-title{
  font-family:var(--kai);
  font-size:30px;
  font-weight:400;
  line-height:1.55;
  letter-spacing:.03em;
  color:var(--ink);
  text-align:center;
  margin-bottom:22px;
}

.home-sub{
  text-align:center;
  font-size:15px;
  color:var(--gold);
  letter-spacing:.1em;
  margin-bottom:52px;
}

/* 首页正文按钮 */
.btn-primary{
  display:block;
  width:100%;
  padding:16px 20px;
  border:none;
  border-radius:12px;
  background:linear-gradient(180deg,var(--crimson-hi),var(--crimson));
  color:#FBF7F2;
  font-family:var(--kai);
  font-size:18px;
  letter-spacing:.22em;
  text-indent:.22em;
  cursor:pointer;
  box-shadow:0 6px 18px rgba(139,46,46,.20);
  transition:transform .18s ease,box-shadow .18s ease,filter .18s ease;
}
.btn-primary:hover{filter:brightness(1.06);box-shadow:0 8px 22px rgba(139,46,46,.26)}
.btn-primary:active{transform:translateY(1px) scale(.986);box-shadow:0 3px 10px rgba(139,46,46,.20)}

.home-foot{
  text-align:center;
  font-size:12.5px;
  color:var(--gold);
  opacity:.75;
  letter-spacing:.14em;
  margin-top:20px;
}

/* ---------- 答题页 ---------- */
.quiz-head{margin-bottom:26px}
.quiz-index{
  display:block;
  font-family:var(--kai);
  font-size:12.5px;
  letter-spacing:.22em;
  color:var(--gold);
  margin-bottom:10px;
}
.progress{
  height:3px;
  border-radius:999px;
  background:rgba(139,115,85,.16);
  overflow:hidden;
}
.progress-fill{
  height:100%;
  width:0;
  border-radius:999px;
  background:linear-gradient(90deg,#B8985F,var(--gold),#A0824E);
  transition:width .5s cubic-bezier(.22,.61,.36,1);
}

.q-card{
  background:var(--card);
  border:1px solid var(--gold-line);
  border-radius:12px;
  padding:26px 20px 20px;
  box-shadow:0 3px 16px rgba(26,26,46,.055);
}
.q-card.q-enter{animation:qIn .44s cubic-bezier(.22,.61,.36,1)}
.q-card.q-leave{animation:qOut .26s ease forwards}
@keyframes qIn{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
@keyframes qOut{to{opacity:0;transform:translateX(-24px)}}

.q-text{
  font-family:var(--kai);
  font-size:19px;
  font-weight:400;
  line-height:1.7;
  color:var(--ink);
  margin-bottom:22px;
  padding-left:14px;
  border-left:2px solid var(--gold-line-strong);
}

.options{display:block}

.option{
  display:flex;
  align-items:flex-start;
  gap:12px;
  width:100%;
  text-align:left;
  padding:15px 16px;
  margin-bottom:10px;
  background:var(--card-hi);
  border:1px solid var(--gold-line);
  border-radius:12px;
  font-family:var(--serif);
  font-size:15px;
  line-height:1.62;
  color:var(--ink-soft);
  cursor:pointer;
  transition:border-color .22s ease,background .22s ease,transform .22s ease,box-shadow .22s ease;
}
.option:last-child{margin-bottom:0}
.option:hover{
  border-color:var(--gold-line-strong);
  background:#FFFFFF;
  transform:translateX(3px);
}
.option.picked{
  border-color:var(--crimson);
  background:var(--crimson-wash);
  box-shadow:0 0 0 1px rgba(139,46,46,.22) inset;
  transform:translateX(3px);
}

.opt-key{
  flex:0 0 24px;
  height:24px;
  margin-top:1px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:var(--kai);
  font-size:12.5px;
  color:var(--gold);
  border:1px solid var(--gold-line-strong);
  transition:all .22s ease;
}
.option.picked .opt-key{
  background:var(--crimson);
  border-color:var(--crimson);
  color:#FBF7F2;
}

/* ---------- 结果页 ---------- */
.archive-tag{
  text-align:center;
  font-family:var(--kai);
  font-size:12px;
  letter-spacing:.3em;
  color:var(--gold);
  opacity:.85;
  margin-bottom:26px;
}

.portrait-wrap{text-align:center;margin-bottom:24px}
.portrait-frame{
  position:relative;
  width:222px;
  margin:0 auto;
  padding:9px;
  background:var(--card-hi);
  border:1px solid var(--gold-line-strong);
  border-radius:10px;
  box-shadow:0 4px 18px rgba(26,26,46,.07);
}
.portrait-frame::after{
  content:'';position:absolute;inset:4px;
  border:1px solid var(--gold-line);
  border-radius:6px;pointer-events:none;
}
/* 插画容器：具体图腾由 JS 按匹配到的原型注入 */
.portrait-art{
  display:block;
  border-radius:5px;
  background:#F6F2EC;
  overflow:hidden;
  line-height:0;
}
.portrait-art svg{display:block;width:100%;height:auto}
.portrait-art img{display:block;width:100%;height:auto}

/* 判词：紧贴图腾下方，作为画面的一部分 */
.portrait-verse{
  margin-top:15px;
  font-family:var(--kai);
  font-size:14.5px;
  letter-spacing:.1em;
  color:var(--gold);
}
.portrait-verse:empty{display:none}
.portrait-verse::before{content:'「'}
.portrait-verse::after{content:'」'}
.portrait-cap{
  margin-top:12px;
  font-size:12px;
  letter-spacing:.2em;
  color:var(--gold);
  opacity:.8;
}

.persona-name{
  font-family:var(--kai);
  font-size:36px;
  font-weight:400;
  letter-spacing:.16em;
  text-indent:.16em;
  text-align:center;
  color:var(--ink);
  line-height:1.3;
}
.persona-origin{
  text-align:center;
  font-size:13px;
  letter-spacing:.16em;
  color:var(--gold);
  margin-top:8px;
}

.persona-tags{
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:10px;
  margin:18px 0 26px;
}
.tag{
  background:var(--crimson);
  color:#FDF8F3;
  padding:6px 17px;
  border-radius:999px;
  font-family:var(--kai);
  font-size:13.5px;
  letter-spacing:.1em;
  box-shadow:0 2px 8px rgba(139,46,46,.18);
}

.match-row{
  display:flex;
  align-items:center;
  gap:20px;
  background:var(--card);
  border:1px solid var(--gold-line);
  border-radius:12px;
  padding:16px 18px;
  margin-bottom:14px;
  box-shadow:0 2px 12px rgba(26,26,46,.045);
}
.match-score{
  display:flex;
  align-items:baseline;
  gap:2px;
  font-family:var(--kai);
  font-size:38px;
  line-height:1;
  color:var(--crimson);
  flex:0 0 auto;
}
.match-score small{font-size:13px;color:var(--gold);letter-spacing:.06em}
.match-text{
  flex:1;
  font-size:13px;
  color:var(--gold);
  line-height:1.95;
  letter-spacing:.04em;
}
.match-text b{color:var(--ink);font-weight:600}

/* 解析 / 对比 卡片 */
.an-item,.compare-card{
  background:var(--card);
  border:1px solid var(--gold-line);
  border-radius:12px;
  padding:17px 18px;
  margin-bottom:12px;
  box-shadow:0 2px 12px rgba(26,26,46,.045);
}
.an-item h3,.sec-title{
  display:flex;
  align-items:center;
  gap:9px;
  font-family:var(--kai);
  font-size:12.5px;
  font-weight:400;
  letter-spacing:.2em;
  color:var(--gold);
  margin-bottom:9px;
}
.an-item h3::before,.sec-title::before{
  content:'';
  flex:0 0 14px;
  height:1px;
  background:var(--gold);
  opacity:.55;
}
.an-item p,.compare-card p{
  font-size:14.5px;
  line-height:1.98;
  color:var(--ink-soft);
  letter-spacing:.01em;
}
.an-item p b{color:var(--crimson);font-weight:600}
.compare-card p b{color:var(--crimson);font-weight:600}
/* 维度名后的分值：小号暗金，与深红维度名区分 */
.compare-card p i{
  font-style:normal;
  font-family:var(--kai);
  font-size:12.5px;
  color:var(--gold);
  margin-left:3px;
}

/* 雷达图卡片 */
.radar-card{
  background:var(--card);
  border:1px solid var(--gold-line);
  border-radius:12px;
  padding:18px;
  margin:18px 0 12px;
  box-shadow:0 2px 12px rgba(26,26,46,.045);
}
.radar-box{position:relative;height:296px;margin-top:4px}
.radar-box canvas{display:block;width:100%!important;height:100%!important}

.radar-legend{
  display:flex;
  justify-content:center;
  gap:26px;
  margin-top:6px;
  font-size:12px;
  color:var(--gold);
  letter-spacing:.1em;
}
.radar-legend span{display:flex;align-items:center;gap:7px}
.ln-solid{display:inline-block;width:20px;height:2px;background:var(--crimson);border-radius:2px}
.ln-dash{
  display:inline-block;width:20px;height:0;
  border-top:2px dashed var(--grey);
}

.dim-scores{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:2px 20px;
  margin-top:18px;
  padding-top:14px;
  border-top:1px dashed var(--gold-line);
}
.dim-row{
  display:flex;
  justify-content:space-between;
  align-items:baseline;
  padding:6px 0;
  border-bottom:1px dashed rgba(139,115,85,.14);
}
.dim-name{font-size:12.5px;color:var(--gold);letter-spacing:.08em}
.dim-val{font-family:var(--kai);font-size:12.5px;color:#9A9AA6;letter-spacing:.04em}
.dim-val b{color:var(--crimson);font-size:15px}

.fallback-note{
  display:none;
  margin-top:10px;
  text-align:center;
  font-size:11.5px;
  color:var(--gold);
  opacity:.7;
  letter-spacing:.06em;
}

/* 次级按钮：上一题 / 查看上次结果 / 回到上一题 */
.btn-prev{
  display:block;
  width:100%;
  margin-top:14px;
  padding:11px 16px;
  border:1px solid var(--gold-line-strong);
  border-radius:10px;
  background:transparent;
  color:var(--gold);
  font-family:var(--kai);
  font-size:14px;
  letter-spacing:.1em;
  cursor:pointer;
  transition:background .2s ease,border-color .2s ease,transform .18s ease;
}
.btn-prev:hover{background:rgba(139,115,85,.06)}
.btn-prev:active{transform:translateY(1px) scale(.99)}
/* hidden 属性要显式压过上面的 display:block */
.btn-prev[hidden]{display:none}

.btn-last{margin-top:12px}
.btn-back{margin-top:22px}
.btn-restart{margin-top:14px}

/* 极窄屏微调 */
@media (max-width:360px){
  .home-title{font-size:26px}
  .persona-name{font-size:31px}
  .match-score{font-size:32px}
  .dim-scores{grid-template-columns:1fr}
}
</style>

  // 按原型注入人物画像与判词
  function renderPortrait(name) {
    var src = PORTRAIT_IMG[name];
    if (!src) return;
    $('portrait-art').innerHTML =
      '<img src="' + src + '" alt="' + name + '画像">';
    $('portrait-verse').textContent = PERSONA_VERSE[name] || '';
  }

  /* ==========================================================
     五、运行时状态
     ========================================================== */
  var current = 0;                 // 当前题号
  var answers = [];                // 每题的选项键（'A'~'D'），回退改答案靠它
  var userVec = [0, 0, 0, 0, 0, 0];// 用户六维累计分（由 answers 派生，见 recalcScores）
  var locked = false;              // 防止连点
  var radarChart = null;           // Chart.js 实例

  /* DOM 快捷引用 */
  var $ = function (id) { return document.getElementById(id); };
  var qCard = $('q-card');

  /* ==========================================================
     六、屏幕切换
     ========================================================== */
  function goScreen(id) {
    var all = document.querySelectorAll('.screen');
    for (var i = 0; i < all.length; i++) all[i].classList.remove('active');
    $(id).classList.add('active');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  /* ==========================================================
     七、答题流程
     ========================================================== */
  function startQuiz() {
    current = 0;
    answers = [];
    userVec = [0, 0, 0, 0, 0, 0];
    locked = false;
    goScreen('screen-quiz');
    renderQuestion();
  }

  // 六维分数一律由 answers 重新累加得出。
  // 这样回退、改答案都不需要做"减去上一题"的补偿，避免加减不平导致分数漂移。
  function recalcScores() {
    userVec = [0, 0, 0, 0, 0, 0];
    for (var i = 0; i < answers.length; i++) {
      // 优先用每题专属权重 QW[i]，让「轻量版侧重偏移」生效；缺省回落全局 WEIGHTS
      var w = (QW && QW[i] && QW[i][answers[i]]) ? QW[i][answers[i]] : WEIGHTS[answers[i]];
      if (!w) continue;
      for (var k = 0; k < DIMS.length; k++) userVec[k] += w[k];
    }
  }

  function renderQuestion() {
    var q = QUESTIONS[current];

    // 进度：已答数 / 总题数
    $('quiz-index').textContent = '第 ' + (current + 1) + ' / ' + QUESTIONS.length + ' 题';
    $('progress-fill').style.width = (current / QUESTIONS.length * 100) + '%';

    $('q-text').textContent = q.q;

    // 渲染选项
    var box = $('options');
    box.innerHTML = '';
    var KEYS = ['A', 'B', 'C', 'D'];
    for (var i = 0; i < q.o.length; i++) {
      (function (idx, key) {
        var btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'option';
        btn.innerHTML = '<span class="opt-key">' + key + '</span>' +
                        '<span class="opt-text">' + q.o[idx] + '</span>';
        // 回退到已答过的题时，把当时选的项高亮出来，方便看清并直接改
        if (answers[current] === key) btn.classList.add('picked');
        btn.addEventListener('click', function () { pick(key, btn); });
        box.appendChild(btn);
      })(i, KEYS[i]);
    }

    // 第一题没有上一题可退
    $('btn-prev').hidden = (current === 0);

    // 入场动画（强制重排以便重放）
    qCard.classList.remove('q-enter', 'q-leave');
    void qCard.offsetWidth;
    qCard.classList.add('q-enter');
  }

  // 回退一题：保留该题已选答案，用户可直接改，也可继续往回退
  function goPrev() {
    if (locked || current <= 0) return;
    current--;
    renderQuestion();
  }

  function pick(key, btn) {
    if (locked) return;
    locked = true;

    // 记录本题答案并重算六维（覆盖式，改答案不会重复累加）
    answers[current] = key;
    recalcScores();

    // 选中反馈 → 过渡 → 下一题
    btn.classList.add('picked');
    $('progress-fill').style.width = ((current + 1) / QUESTIONS.length * 100) + '%';

    setTimeout(function () {
      qCard.classList.add('q-leave');
      setTimeout(function () {
        qCard.classList.remove('q-leave');
        current++;
        locked = false;
        if (current < QUESTIONS.length) {
          renderQuestion();
        } else {
          showResult();
        }
      }, 260);
    }, 320);
  }

  /* ==========================================================
     八、结果计算
     ========================================================== */
  // 差值绝对值之和最小者即最接近的原型
  function matchPersona() {
    var best = null;
    for (var i = 0; i < PERSONAS.length; i++) {
      var diff = 0;
      for (var k = 0; k < DIMS.length; k++) {
        diff += Math.abs(PERSONAS[i].vec[k] - userVec[k]);
      }
      if (!best || diff < best.diff) best = { persona: PERSONAS[i], diff: diff, index: i };
    }
    return best;
  }

  // 差值 → 匹配度。
  // 用户与原型六维之和同为 180，实际差值集中在 40~130，
  // 因此用经验系数 0.30 压缩到 60~96 的可读区间。
  function toScore(diff) {
    var raw = 100 - diff * 0.30;
    return Math.round(Math.min(96, Math.max(60, raw)));
  }

  function levelText(score) {
    if (score >= 86) return '非常接近';
    if (score >= 76) return '比较接近';
    if (score >= 66) return '部分重合';
    return '轮廓相远';
  }

  function shapeText() {
    var mx = Math.max.apply(null, userVec);
    var mn = Math.min.apply(null, userVec);
    var spread = mx - mn;
    if (spread >= 48) return '一种特点突出';
    if (spread >= 34) return '两极较为分明';
    return '分布相对均衡';
  }

  /* ==========================================================
     九、结果页渲染
     ========================================================== */
  /* ==========================================================
     八·补：结果存档（localStorage）
     刷新页面不该丢掉上一次的测试结果。存档里连答案一起存，
     这样从存档恢复后「回到上一题」依然可用。
     ========================================================== */
  var STORE_KEY = 'shijian-persona-last';

  function saveResult(vec, name, score) {
    try {
      localStorage.setItem(STORE_KEY, JSON.stringify({
        v: vec.slice(), n: name, s: score, a: answers.slice(), t: Date.now()
      }));
    } catch (e) {
      // 隐私模式或存储被禁用：不影响测试结果本身，静默跳过
    }
  }

  function loadLast() {
    try {
      var raw = localStorage.getItem(STORE_KEY);
      return raw ? JSON.parse(raw) : null;
    } catch (e) {
      return null;
    }
  }

  function findPersona(name) {
    for (var i = 0; i < PERSONAS.length; i++) {
      if (PERSONAS[i].name === name) return PERSONAS[i];
    }
    return null;
  }

  // 首页的「查看上次结果」入口：有存档才显示，并带上原型名与日期
  function refreshLastEntry() {
    var btn = $('btn-last');
    var last = loadLast();
    if (!last || !last.v || !findPersona(last.n)) {
      btn.hidden = true;
      return;
    }
    var d = new Date(last.t);
    btn.textContent = '查看上次结果 · ' + last.n + '（' +
                      (d.getMonth() + 1) + '/' + d.getDate() + '）';
    btn.hidden = false;
  }

  function showSavedResult() {
    var last = loadLast();
    if (!last || !last.v) return;
    var p = findPersona(last.n);
    if (!p) return;
    answers = Array.isArray(last.a) ? last.a.slice() : [];
    userVec = last.v.slice();
    current = Math.min(answers.length, QUESTIONS.length);
    renderResult(p, last.s, false);
  }

  function showResult() {
    var best = matchPersona();
    renderResult(best.persona, toScore(best.diff), true);
  }

  // 结果页渲染。分数由外部传入，便于「查看上次结果」时直接复用存档里的分数
  function renderResult(p, score, save) {

    // 归档编号
    $('archive-tag').textContent = 'ARCHIVE · HP-' +
      String(Math.floor(Math.random() * 900) + 100);

    // 人物信息 + 专属器物图腾与判词
    $('persona-name').textContent = p.name;
    $('persona-origin').textContent = p.origin;
    renderPortrait(p.name);

    var tagBox = $('persona-tags');
    tagBox.innerHTML = '';
    p.tags.forEach(function (t) {
      var el = document.createElement('span');
      el.className = 'tag';
      el.textContent = t;
      tagBox.appendChild(el);
    });

    // 匹配度区
    $('match-num').textContent = score;
    $('match-level').textContent = levelText(score);
    $('match-shape').textContent = shapeText();

    // 四段解析
    $('an-value').textContent = p.value;
    $('an-action').textContent = p.action;
    $('an-over').textContent = p.over;
    $('an-adjust').textContent = p.adjust;

    // 六维得分明细
    var rows = $('dim-scores');
    rows.innerHTML = '';
    for (var i = 0; i < DIMS.length; i++) {
      var row = document.createElement('div');
      row.className = 'dim-row';
      row.innerHTML = '<span class="dim-name">' + DIMS[i] + '</span>' +
                      '<span class="dim-val"><b>' + userVec[i] + '</b>/' + p.vec[i] + '</span>';
      rows.appendChild(row);
    }

    // 对比分析
    renderCompare(p);

    if (save) saveResult(userVec, p.name, score);

    goScreen('screen-result');

    // 雷达图（等布局稳定后绘制）
    setTimeout(function () { renderRadar(p.vec); }, 60);
  }

  // 最接近的几个维度 + 最不一样的一个维度。
  // 两个坑：① 只按「差值小」挑，会把双方都很低的维度也算进去——全选 A 的人统筹只有 20 分，
  //          却被告知"最像的地方是统筹掌控"，等于把弱项说成了像点；
  //        ② 差值其实很大时仍说"最接近"，读起来自相矛盾。
  // 处理：先剔除用户几乎不具备的维度（<15 分），再砍掉差值 > 20 的项，最后把双方分值带上，
  //       让读者看到的是"同等水平"而不是"同样突出"。
  function renderCompare(p) {
    var list = [];
    for (var i = 0; i < DIMS.length; i++) {
      list.push({ name: DIMS[i], d: Math.abs(userVec[i] - p.vec[i]), u: userVec[i], v: p.vec[i] });
    }

    var pool = list.filter(function (o) { return o.u >= 15; });
    if (pool.length < 3) pool = list;

    var ordered = pool.slice().sort(function (a, b) { return a.d - b.d; });
    var near = ordered.slice(0, 3).filter(function (o) { return o.d <= 20; });
    if (near.length < 2) near = ordered.slice(0, 2);

    var far = list.slice().sort(function (a, b) { return b.d - a.d; })[0];

    $('compare-title').textContent = '你和 ' + p.name + ' 像在哪里';

    var fmt = function (o) { return o.name + '<i>' + o.u + '/' + o.v + '</i>'; };
    $('compare-text').innerHTML =
      '最接近的地方是 <b>' + near.map(fmt).join('、') + '</b>；' +
      '最不一样的地方是 <b>' + fmt(far) + '</b>。';
  }

  /* ==========================================================
     十、雷达图：优先 Chart.js，失败则用内置 canvas 绘制
     ========================================================== */
  // 策略：先用内置绘制立刻出图（绝不留白），Chart.js 若稍后到位再升级为可交互版本
  function renderRadar(protoVec) {
    $('fallback-note').style.display = 'none';
    drawRadarFallback(protoVec);
    upgradeRadar(protoVec, 0);
  }

  // 等 Chart.js（CDN 可能还在路上），拿到就升级；三次都没来就保留内置图并给出说明
  function upgradeRadar(protoVec, attempt) {
    if (typeof Chart !== 'undefined') {
      buildChartJS(protoVec);
      return;
    }
    if (attempt >= 3) {
      $('fallback-note').style.display = 'block';
      return;
    }
    setTimeout(function () { upgradeRadar(protoVec, attempt + 1); }, 600);
  }

  function buildChartJS(protoVec) {
    var canvas = $('radar');
    if (radarChart) { radarChart.destroy(); radarChart = null; }

    radarChart = new Chart(canvas.getContext('2d'), {
      type: 'radar',
      data: {
        labels: DIMS,
        datasets: [
          {   // 用户：深红实线
            label: '你',
            data: userVec.slice(),
            borderColor: '#8B2E2E',
            backgroundColor: 'rgba(139,46,46,0.10)',
            borderWidth: 2,
            pointBackgroundColor: '#8B2E2E',
            pointBorderColor: '#FBF9F6',
            pointBorderWidth: 1.5,
            pointRadius: 3,
            pointHoverRadius: 4,
            fill: true,
            order: 1
          },
          {   // 对标人物：灰色虚线
            label: '对标人物',
            data: protoVec.slice(),
            borderColor: '#A2968A',
            backgroundColor: 'rgba(162,150,138,0.06)',
            borderWidth: 1.5,
            borderDash: [5, 4],
            pointBackgroundColor: '#A2968A',
            pointBorderColor: '#FBF9F6',
            pointBorderWidth: 1.5,
            pointRadius: 2.5,
            pointHoverRadius: 3.5,
            fill: true,
            order: 2
          }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        animation: { duration: 900, easing: 'easeOutQuart' },
        layout: { padding: 6 },
        plugins: {
          legend: { display: false },
          tooltip: {
            backgroundColor: 'rgba(26,26,46,0.88)',
            titleFont: { size: 12, family: 'KaiTi, serif' },
            bodyFont: { size: 12 },
            padding: 9,
            displayColors: false
          }
        },
        scales: {
          r: {
            min: 0,
            max: DIM_MAX,
            beginAtZero: true,
            ticks: {
              stepSize: 15,
              color: '#C2B6A6',
              backdropColor: 'transparent',
              font: { size: 9 },
              showLabelBackdrop: false
            },
            grid: { color: 'rgba(139,115,85,0.18)', circular: false },
            angleLines: { color: 'rgba(139,115,85,0.18)' },
            pointLabels: {
              color: '#8B7355',
              padding: 8,
              font: { size: 11.5, family: 'Songti SC, SimSun, serif' }
            }
          }
        }
      }
    });
  }

  // 内置绘制：不依赖任何外部库
  // 显示尺寸完全交给 CSS（.radar-box canvas 上带 !important），这里只按容器实际像素
  // 设定位图分辨率。千万不要写 inline 尺寸——会被 !important 覆盖，导致画出来的图被拉伸变形。
  function drawRadarFallback(protoVec) {
    var canvas = $('radar');
    var box = canvas.parentNode;
    var dpr = window.devicePixelRatio || 1;

    var w = box.clientWidth || 320;
    var h = box.clientHeight || 320;
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);

    var ctx = canvas.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);

    var N = DIMS.length;
    var cx = w / 2, cy = h / 2;
    var R = Math.min(w, h) / 2 - 42;
    var step = Math.PI * 2 / N;
    var start = -Math.PI / 2;

    function xy(i, v) {
      var a = start + i * step;
      var r = R * (v / DIM_MAX);
      return [cx + Math.cos(a) * r, cy + Math.sin(a) * r];
    }

    // 同心网格
    for (var ring = 1; ring <= 4; ring++) {
      ctx.beginPath();
      for (var i = 0; i < N; i++) {
        var p = xy(i, DIM_MAX * ring / 4);
        i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]);
      }
      ctx.closePath();
      ctx.strokeStyle = 'rgba(139,115,85,0.18)';
      ctx.lineWidth = 1;
      ctx.stroke();
    }

    // 轴线
    ctx.strokeStyle = 'rgba(139,115,85,0.18)';
    for (var j = 0; j < N; j++) {
      var e = xy(j, DIM_MAX);
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.lineTo(e[0], e[1]);
      ctx.stroke();
    }

    // 数据系列
    function series(vec, stroke, dash, fill) {
      ctx.beginPath();
      for (var i = 0; i < N; i++) {
        var p = xy(i, vec[i]);
        i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]);
      }
      ctx.closePath();
      ctx.fillStyle = fill;
      ctx.fill();
      ctx.setLineDash(dash || []);
      ctx.strokeStyle = stroke;
      ctx.lineWidth = dash ? 1.5 : 2;
      ctx.stroke();
      ctx.setLineDash([]);
      // 顶点
      for (var k = 0; k < N; k++) {
        var q = xy(k, vec[k]);
        ctx.beginPath();
        ctx.arc(q[0], q[1], dash ? 2.4 : 3, 0, Math.PI * 2);
        ctx.fillStyle = stroke;
        ctx.fill();
      }
    }

    series(protoVec, 'rgba(162,150,138,0.9)', [5, 4], 'rgba(162,150,138,0.06)');
    series(userVec, '#8B2E2E', null, 'rgba(139,46,46,0.10)');

    // 维度标签
    ctx.fillStyle = '#8B7355';
    ctx.font = '11.5px "Songti SC", SimSun, serif';
    for (var m = 0; m < N; m++) {
      var a = start + m * step;
      var lx = cx + Math.cos(a) * (R + 22);
      var ly = cy + Math.sin(a) * (R + 22);
      ctx.textAlign = Math.abs(Math.cos(a)) < 0.2 ? 'center'
                    : (Math.cos(a) > 0 ? 'left' : 'right');
      ctx.textBaseline = 'middle';
      ctx.fillText(DIMS[m], lx, ly);
    }
  }

  /* ==========================================================
     十一、事件绑定
     ========================================================== */
  $('btn-start').addEventListener('click', startQuiz);

  $('btn-prev').addEventListener('click', goPrev);
  $('btn-last').addEventListener('click', showSavedResult);

  // 结果页返回第 10 题：答完最后一题才发现手滑，也还有退路
  $('btn-back').addEventListener('click', function () {
    if (current >= QUESTIONS.length) current = QUESTIONS.length - 1;
    goScreen('screen-quiz');
    renderQuestion();
  });

  $('btn-restart').addEventListener('click', function () {
    if (radarChart) { radarChart.destroy(); radarChart = null; }
    startQuiz();
  });

  // 有存档才显示首页的「查看上次结果」
  refreshLastEntry();

  // 结果页若窗口尺寸变化，重绘雷达图
  var resizeTimer = null;
  window.addEventListener('resize', function () {
    if (!$('screen-result').classList.contains('active')) return;
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function () {
      if (radarChart) { radarChart.resize(); }
      else { drawRadarFallback(matchPersona().persona.vec); }
    }, 220);
  });

})();
</script>
</body>
</html>
